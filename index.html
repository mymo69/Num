<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e11">
<title>🔮 เลขศาสตร์ Gold Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e11;--card:#1d1b20;--card2:#252329;--gold:#f5d76e;--gold2:#ffeaa0;--text:#fff;--muted:#b3b0b8;--line:rgba(245,215,110,.2);--ok:#8de29f;--bad:#ff9a9a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{--s:max(11.5px,.85rem);--b:max(12.5px,.92rem);font-size:clamp(12.5px,min(2.2vh,3.9vw),17px);-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Prompt","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
#app{height:100%;height:100dvh;max-width:34rem;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);position:relative}
#app::before{content:"";position:absolute;top:-25%;left:50%;width:120%;height:55%;transform:translateX(-50%);background:radial-gradient(circle,rgba(245,215,110,.16),transparent 70%);pointer-events:none}
header{position:relative;text-align:center;padding:.4rem 1rem .15rem}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h1 b{color:var(--gold)}
.sub{font-size:var(--s);color:var(--muted);line-height:1.3}
.pane{position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:.3rem .9rem .5rem;display:flex;flex-direction:column;gap:.5rem}
.pane::-webkit-scrollbar{display:none}
.pane[hidden]{display:none}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:1.2rem;padding:.65rem .8rem}
.lbl{display:block;font-size:var(--s);font-weight:600;color:var(--gold);margin:0 0 .15rem .3rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.g32{display:grid;grid-template-columns:3fr 2fr;gap:.5rem}
.sec{font-size:var(--s);font-weight:700;color:var(--gold2);margin:.1rem 0 -.15rem .3rem}.sec small{font-weight:500;color:var(--muted);font-size:var(--s)}
.xc{display:flex;gap:.7rem;align-items:flex-start}.xc .t{flex:1;min-width:0}.num.s{width:3.9rem;height:3.9rem;font-size:2.1rem;border-radius:1rem;flex:none}
input{width:100%;height:3.1rem;border-radius:1rem;background:var(--card);border:1.6px solid var(--line);color:#fff;padding:0 1rem;font-family:inherit;font-weight:500;font-size:max(16px,1.25rem);outline:none;color-scheme:dark}
input:focus{border-color:var(--gold)}
input::placeholder{color:#908c99}
textarea{width:100%;display:block;height:4.2rem;border-radius:1rem;background:var(--card2);border:1.6px solid var(--line);color:#fff;padding:.55rem 1rem;font-family:inherit;font-weight:500;font-size:max(16px,1.1rem);line-height:1.35;outline:none;resize:none;color-scheme:dark}
textarea:focus{border-color:var(--gold)}textarea::placeholder{color:#908c99}
.qc{border-color:var(--line);background:linear-gradient(180deg,rgba(245,215,110,.09),var(--card))}.qc .lbl{margin-left:.1rem}
.qx{display:flex;gap:.35rem;margin-top:.4rem;flex-wrap:wrap}.qx button{border:1px solid rgba(255,255,255,.09);background:var(--card2);color:var(--muted);border-radius:99px;padding:.25rem .7rem;font-family:inherit;font-weight:600;font-size:var(--s);cursor:pointer}.qx button:active{background:var(--gold);color:var(--bg)}
.btn{height:3.3rem;border:0;border-radius:1.1rem;font-family:inherit;font-weight:700;font-size:1.25rem;background:var(--gold);color:var(--bg);box-shadow:0 .6rem 1.4rem rgba(245,215,110,.22);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--muted);box-shadow:none;border:1px solid rgba(255,255,255,.08);font-size:1rem;padding:0 1rem}
.row{display:flex;gap:.55rem}.row .btn:first-child{flex:1}
.err{border-radius:.9rem;background:#2a1f1f;border:1px solid #ff7a7a44;color:var(--bad);padding:.5rem .8rem;font-size:var(--b);line-height:1.35}
.err:empty{display:none}
.note{font-size:var(--s);color:var(--muted);text-align:center;line-height:1.4;opacity:.85}
.hero{display:flex;gap:.8rem;align-items:flex-start}
.big{flex:none;width:6.3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.num{width:6.3rem;height:6.3rem;border-radius:1.4rem;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:3.7rem;font-weight:700;color:var(--gold);line-height:1}
.badge{font-size:var(--s);font-weight:700;background:var(--gold);color:var(--bg);border-radius:99px;padding:.15rem .6rem;white-space:nowrap}
.hero .t{min-width:0;flex:1}
.k{font-size:var(--s);font-weight:600;letter-spacing:.06em;color:var(--gold)}
.ttl{font-size:1.15rem;font-weight:700;line-height:1.3;margin-top:.1rem}.ttl span{color:var(--gold2)}
.desc{margin-top:.35rem;font-size:var(--b);line-height:1.5;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.chip{border:1px solid rgba(255,255,255,.09);background:var(--card2);color:var(--muted);border-radius:.9rem;padding:.35rem .1rem;font-family:inherit;font-weight:600;font-size:var(--s);line-height:1.2;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.05rem}
.chip i{font-style:normal;font-size:1.05rem}.chip b{font-size:1rem;color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}.chip.on b{color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.h{font-size:var(--s);font-weight:700;margin-bottom:.25rem}.h.g{color:var(--ok)}.h.r{color:var(--bad)}.h.m{color:var(--muted)}
.p{font-size:var(--b);line-height:1.5;font-weight:500}
.hr{height:1px;background:rgba(255,255,255,.07);margin:.5rem 0}
.foot{text-align:center;font-size:var(--s);color:var(--muted);opacity:.7;line-height:1.4}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.mini{text-align:center;padding:.6rem .3rem}
.mini b{display:block;font-size:2.4rem;color:var(--gold);line-height:1.1}
.mini span{font-size:var(--s);color:var(--muted);font-weight:600}.mini em{display:block;font-style:normal;font-size:var(--s);margin-top:.1rem}
.sw{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;vertical-align:-.12rem;margin-right:.3rem;border:1px solid rgba(255,255,255,.4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.cell{background:var(--card2);border:1px solid rgba(255,255,255,.08);border-radius:1rem;text-align:center;padding:.4rem .2rem}
.cell.has{border-color:var(--line)}.cell.strong{background:rgba(245,215,110,.14);border-color:var(--gold)}
.cell b{font-size:1.8rem;line-height:1.1;color:var(--gold);display:block}.cell.no b{color:#8f8b98}
.cell small{display:block;font-size:var(--s);color:var(--muted);line-height:1.2}
.cell s{text-decoration:none;display:block;font-size:var(--s);letter-spacing:.1em;min-height:1.1em;color:var(--gold2)}
.score{text-align:center}.score b{font-size:3.4rem;color:var(--gold);line-height:1}.score b small{font-size:1.4rem}
.bar{height:.55rem;border-radius:9px;background:var(--bg);overflow:hidden;margin:.45rem 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px}
.ask{display:flex;gap:.5rem}.ask input{flex:1;min-width:0;height:2.9rem}.ask .btn{height:2.9rem;flex:none;padding:0 1rem;font-size:1rem}
.vd{display:flex;gap:.7rem;align-items:center}.vd .sc{flex:none;text-align:center;line-height:1;font-size:2.4rem;font-weight:700;color:var(--gold)}.vd .sc small{font-size:1rem}.vd .sc span{display:block;font-size:1.6rem;margin-bottom:.15rem}
.qt{font-size:var(--s);color:var(--muted);margin-bottom:.35rem;font-style:italic}
.ln{font-size:var(--b);line-height:1.5;font-weight:500}.ln+.ln{margin-top:.35rem}
.ex{display:flex;flex-direction:column;gap:.4rem}.ex .chip{flex-direction:row;justify-content:flex-start;gap:.5rem;padding:.55rem .8rem;text-align:left;font-size:var(--b)}
#mres{display:flex;flex-direction:column;gap:.5rem}
.empty{margin:auto;text-align:center;line-height:1.6;color:var(--muted);display:flex;flex-direction:column;gap:.7rem;align-items:center}
.empty .btn{padding:0 1.4rem;font-size:1.1rem;height:3rem}
nav{display:grid;grid-template-columns:repeat(7,1fr);background:#16141a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{border:0;background:none;color:var(--muted);padding:.4rem 0 .35rem;font-family:inherit;font-weight:600;font-size:max(.8rem,11px);line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:.05rem;cursor:pointer;border-top:2px solid transparent}
nav button i{font-style:normal;font-size:1.35rem;line-height:1.2}
nav button[aria-selected=true]{color:var(--gold);border-top-color:var(--gold)}
#toast{position:absolute;left:50%;bottom:4.6rem;transform:translateX(-50%);background:var(--gold);color:var(--bg);font-weight:700;font-size:.95rem;padding:.45rem 1rem;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:5}
#toast.on{opacity:1}
.th{overflow-wrap:break-word;word-break:normal;line-break:auto}.w{white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-height:600px){.pane{gap:.3rem}.chip i{font-size:1rem}}
@media (max-height:700px){textarea{height:3.5rem}.sub{display:none}.pane{gap:.4rem;padding:.25rem .8rem .4rem}.card{padding:.5rem .65rem}.num{width:5rem;height:5rem;font-size:3rem}.big{width:5rem;gap:.3rem}.hero{gap:.6rem}.hr{margin:.35rem 0}.chip{padding:.25rem .1rem}.desc{margin-top:.2rem}h1{font-size:1.4rem}header{padding:.3rem 1rem 0}input{height:2.9rem}.btn{height:3rem}}
@media (max-height:620px){#p6{gap:.3rem}#p6 .qt,#p6 .foot{display:none}#p6 .card{padding:.4rem .6rem}#p6 .hr{margin:.25rem 0}#p6 .vd .sc{font-size:2rem}#p6 .bar{margin:.3rem 0}.ask input,.ask .btn{height:2.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>✦ <b>เลขศาสตร์</b> 🔮</h1>
  <p class="sub">✨ ค้นหาพลังตัวเลขจากชื่อและวันเกิด 🌙</p>
</header>

<section class="pane" id="p0" role="tabpanel" aria-label="ข้อมูล">
  <div><label class="lbl" for="dob">🎂 วันเกิด</label><input id="dob" type="date" min="1900-01-01"></div>
  <div class="g2">
    <div><label class="lbl" for="fn">👤 ชื่อ</label><input id="fn" autocomplete="off" maxlength="40" placeholder="สมชาย"></div>
    <div><label class="lbl" for="ln">👥 นามสกุล</label><input id="ln" autocomplete="off" maxlength="40" placeholder="ใจดี"></div>
  </div>
  <div class="card qc"><label class="lbl" for="q">❓ คำถามที่อยากรู้ <small style="font-weight:500;color:var(--muted)">(พิมพ์เรื่องที่อยากรู้ ระบุช่วงเวลาจะแม่นขึ้น)</small></label><textarea id="q" maxlength="150" rows="2" placeholder="เช่น ปีนี้ควรเปลี่ยนงานไหม"></textarea><div class="qx"><button type="button" data-qs="ปีนี้ควรเปลี่ยนงานไหม">💼 งาน</button><button type="button" data-qs="เดือนนี้เรื่องความรักเป็นอย่างไร">💞 รัก</button><button type="button" data-qs="ควรลงทุนตอนนี้ไหม">💰 เงิน</button><button type="button" data-qs="ปีนี้สุขภาพเป็นอย่างไร">🩺 สุขภาพ</button></div></div>
  <p class="sec">🧩 ข้อมูลเสริม <small>(ไม่บังคับ • ไม่บันทึกในเครื่อง)</small></p>
  <div><label class="lbl" for="nid">🪪 เลขบัตรประชาชน 13 หลัก</label><input id="nid" inputmode="numeric" autocomplete="off" maxlength="17" placeholder="x-xxxx-xxxxx-xx-x"></div>
  <div class="g32">
    <div><label class="lbl" for="tel">📱 เบอร์มือถือ</label><input id="tel" type="tel" inputmode="tel" autocomplete="off" maxlength="15" placeholder="08x-xxx-xxxx"></div>
    <div><label class="lbl" for="seen">👁️ เลขที่เห็นตอนนี้</label><input id="seen" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="2 ตัว"></div>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="row"><button class="btn" id="go">🔮 ดูดวงเลย ✦</button><button class="btn ghost" id="clr" aria-label="ล้างข้อมูล">🗑️ ล้าง</button></div>
  <p class="note">📐 Pythagorean • ก-ฮ = 1-9 วนซ้ำ • มาสเตอร์ 11/22/33<br>🔒 เลขบัตรและเบอร์ใช้คำนวณในเครื่อง ไม่ถูกบันทึกหรือส่งออก</p>
</section>

<section class="pane" id="p1" role="tabpanel" aria-label="เลขหลัก" hidden></section>
<section class="pane" id="p2" role="tabpanel" aria-label="พยากรณ์" hidden></section>

<section class="pane" id="p3" role="tabpanel" aria-label="เข้ากัน" hidden>
  <div><label class="lbl" for="pdob">💞 วันเกิดของอีกคน</label><input id="pdob" type="date" min="1900-01-01"></div>
  <button class="btn" id="mgo">💘 ตรวจความเข้ากัน</button>
  <div id="mres"></div>
</section>

<section class="pane" id="p4" role="tabpanel" aria-label="ตาราง" hidden></section>
<section class="pane" id="p5" role="tabpanel" aria-label="เจาะลึก" hidden></section>
<section class="pane" id="p6" role="tabpanel" aria-label="ถามดวง" hidden></section>

<nav role="tablist" aria-label="เมนู">
  <button role="tab" aria-selected="true" data-t="0"><i>📝</i>ข้อมูล</button>
  <button role="tab" aria-selected="false" data-t="1"><i>🔢</i>เลขหลัก</button>
  <button role="tab" aria-selected="false" data-t="2"><i>🔮</i>พยากรณ์</button>
  <button role="tab" aria-selected="false" data-t="3"><i>💞</i>เข้ากัน</button>
  <button role="tab" aria-selected="false" data-t="4"><i>🧮</i>ตาราง</button>
  <button role="tab" aria-selected="false" data-t="5"><i>🔭</i>เจาะลึก</button>
  <button role="tab" aria-selected="false" data-t="6"><i>🙋</i>ถามดวง</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const MASTER=[11,22,33], KEY='numerology-gold-oracle.v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seg=null;try{if(window.Intl&&Intl.Segmenter)seg=new Intl.Segmenter('th',{granularity:'word'});}catch(e){}
const th=t=>{t=String(t);try{return seg?Array.from(seg.segment(t)).map(x=>x.isWordLike?'<span class="w">'+esc(x.segment)+'</span>':esc(x.segment)).join('<wbr>'):esc(t);}catch(e){return esc(t);}};
const ds=n=>String(n).split('').reduce((a,c)=>a+Number(c),0);
const red=(n,keep=true)=>{n=Math.abs(Math.trunc(n))||0;while(n>9&&!(keep&&MASTER.includes(n)))n=ds(n);return n;};
const base=n=>red(n,false);
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}},
 set(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}},del(){try{localStorage.removeItem(KEY);}catch(e){}}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);};

/* ---------- data ---------- */
const CON='กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ', VOW='ะัาำิีึืุูเแโใไฤ';
const M={
1:['ผู้นำ นักบุกเบิก','คุณเกิดมาเพื่อนำทาง ไม่ใช่เดินตาม มีไฟบุกเบิก กล้าคิดกล้าทำ และตัดสินใจเด็ดขาดด้วยตัวเอง','มั่นใจ กล้าหาญ ตัดสินใจไว','ใจร้อน ดื้อ ชอบแบกทุกอย่างไว้เอง','ผู้บริหาร สตาร์ทอัพ นักกีฬา ที่ปรึกษา','ชัดเจน ตรงไปตรงมา ชอบคนที่เก่งและเคารพพื้นที่'],
2:['นักประสาน อ่อนโยน','คุณคือคนกลางที่ทำให้ทุกอย่างสมดุล อ่อนโยน ละเอียด และเข้าใจความรู้สึกคนอื่นได้ลึกซึ้งมาก','ใจเย็น เข้าอกเข้าใจ ประนีประนอม','คิดมาก อ่อนไหว กลัวความขัดแย้ง','นักจิตวิทยา HR ศิลปิน นักการทูต งานบริการ','ต้องการความอ่อนโยน มั่นคง ใครที่ใส่ใจรายละเอียดจะชนะใจ'],
3:['นักสร้างสรรค์ สดใส','พลังของความสนุก ไอเดีย และการสื่อสาร คุณทำให้บรรยากาศมีชีวิตชีวา และมีพรสวรรค์ด้านการเล่าเรื่อง','สื่อสารเก่ง ครีเอทีฟ มองโลกแง่ดี','เบื่อง่าย กระจายโฟกัส พูดเยอะกว่าทำ','ครีเอเตอร์ พิธีกร นักเขียน การตลาด อินฟลูเอนเซอร์','ขี้เล่น ชอบคนคุยสนุก ไม่ชอบความน่าเบื่อ'],

function parseDob(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  if(y<1900||dt>new Date())return null;
  return {y,m:mo,d};
}
function lifePath(b){const raw=red(b.d)+red(b.m)+red(b.y);return {raw,lp:red(raw)};}
function nameNums(txt){
  const st=[];
  for(const ch of String(txt).normalize('NFC')){
    const u=ch.toUpperCase();
    if(u.length===1&&u>='A'&&u<='Z')st.push({v:(u.charCodeAt(0)-65)%9+1,vw:'AEIOU'.includes(u)});
    else if(CON.includes(ch))st.push({v:CON.indexOf(ch)%9+1,vw:false});
    else if(VOW.includes(ch))st.push({v:VOW.indexOf(ch)%9+1,vw:true});
    else if(ch==='\u0E4C'){const l=st.pop();if(l&&l.vw)st.pop();}
  }
  const sum=f=>st.filter(f).reduce((a,x)=>a+x.v,0);
  return {n:st.length,total:sum(()=>true),vs:sum(x=>x.vw),cs:sum(x=>!x.vw)};
}
function compute(dobStr,fn,ln){
  if(!dobStr)return {err:'📅 กรุณาเลือกวันเกิด'};
  const b=parseDob(dobStr);if(!b)return {err:'📅 วันเกิดไม่ถูกต้องหรืออยู่ในอนาคต'};
  const nn=nameNums((fn||'').trim()+' '+(ln||'').trim());
  if(!(fn||'').trim()&&!(ln||'').trim())return {err:'👤 กรุณากรอกชื่อหรือนามสกุลอย่างน้อย 1 ช่อง'};
  if(!nn.n)return {err:'🔤 ใช้ตัวอักษรไทยหรืออังกฤษเท่านั้น'};
  const L=lifePath(b),ex=red(nn.total),py=pyear(b);
  const r={b,lp:L.lp,lpRaw:L.raw,bd:red(b.d),ex,exRaw:nn.total,
    so:nn.vs?red(nn.vs):ex,pe:nn.cs?red(nn.cs):ex,py,fn:(fn||'').trim(),ln:(ln||'').trim()};
  r.ma=red(r.lp+r.ex);return {r};
}
function pyear(b,now=new Date()){return base(base(b.d)+base(b.m)+base(now.getFullYear()));}

const digits=s=>String(s||'').replace(/\D/g,'');

    if(!/^0[689]\d{8}$/.test(d))return {err:'📱 เบอร์มือถือต้องมี 10 หลัก ขึ้นต้น 06/08/09'};x.tel=d;}

  const tm=a.kind==='when'?`<div class="ln">🗓️ ${th('เดือนที่เหมาะ ')+a.best.map(esc).join(' • ')}</div>`:'';
  const note=a.tp[0]==='health'?'ไม่ใช่คำแนะนำทางการแพทย์ หากกังวลควรปรึกษาแพทย์':a.tp[0]==='money'||a.tp[0]==='biz'?'ไม่ใช่คำแนะนำการลงทุน ตัดสินใจด้วยข้อมูลจริงเสมอ':'เพื่อความบันเทิงและเป็นแนวทางประกอบการตัดสินใจ';
  p.innerHTML=box+`<div class="card th"><div class="qt">❓ “${th(qt)}”</div><div class="vd"><div class="sc"><span>${a.E}</span>${a.sc}<small>%</small></div><div style="min-width:0"><div class="k">${a.tp[1]} ${th(a.tp[2])} • 🎯 ตอบตรงๆ</div><div class="ttl">${th(a.head)}</div></div></div><div class="bar"><i style="width:${a.sc}%"></i></div><div class="p">${th(a.sum)}</div></div>
  <div class="card th"><div class="h m">🔎 ทำไมถึงตอบแบบนี้</div>${a.why.map(x=>`<div class="ln">${th(x)}</div>`).join('')}</div>
  <div class="card th"><div class="h g">✅ ควรทำ</div><div class="p">${a.adv[0].map(x=>th(x)).join(' • ')}</div><div class="hr"></div><div class="h r">⚠️ ควรระวัง</div><div class="p">${a.adv[1].map(x=>th(x)).join(' • ')}</div></div>
  <div class="card th"><div class="h m">📅 จังหวะเวลา</div>${tm}<div class="ln">${a.days.length?th('วันที่เหมาะใน 14 วัน: ')+a.days.map(esc).join(' • '):th('14 วันข้างหน้ายังไม่มีวันเด่น ลองถามใหม่ภายหลัง')}</div></div>
  <div class="foot th">${th('✨ '+note)}</div>`;
}
function ask(txt){
  const t=String(txt||'').trim().slice(0,150);if(!t){toast('❓ พิมพ์คำถามก่อนนะ');return;}
  R.q={text:t,at:new Date()};$('#q').value=t;renderAsk();$('#p6').scrollTop=0;fit();
}
function renderAll(){[renderCore,renderForecast,renderGrid,renderExtra,renderAsk].forEach(f=>{try{f();}catch(e){console.error(e);}});try{renderMatch();}catch(e){}}

/* ---------- interactions ---------- */
function fit(){
  const p=$('.pane:not([hidden])'),r=document.documentElement;if(!p)return;
  r.style.fontSize='';let f=parseFloat(getComputedStyle(r).fontSize);
  while(p.scrollHeight>p.clientHeight+1&&f>11){f-=.5;r.style.fontSize=f+'px';}
}
function showTab(i){
  tab=i;$$('.pane').forEach((p,n)=>p.hidden=n!==i);
  $$('nav button').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.t===i)));
  const p=$('#p'+i);if(p)p.scrollTop=0;
  try{if(i===1)renderCore();if(i===2)renderForecast();}catch(e){console.error(e);}fit();
}
function submit(){
  const fn=$('#fn').value,ln=$('#ln').value,dob=$('#dob').value,e=$('#err');
  const x=compute(dob,fn,ln);
  if(x.err){e.textContent=x.err;return;}
  const ex=readExtras();if(ex.err){e.textContent=ex.err;return;}
  const qt=$('#q').value.trim().slice(0,120);
  e.textContent='';R=x.r;R.x=ex.x;R.q=qt?{text:qt,at:new Date()}:null;sel='lp';store.set({dob,fn,ln});renderAll();showTab(qt?6:1);
}
function summary(){
  const L=KEYS.map(k=>`${k[1]} ${k[2]}: ${R[k[0]]}`).join('\n');
  return `🔮 เลขศาสตร์ของ ${R.fn} ${R.ln}\n${L}\n✨ ${M[R.lp][0]}`;
}
async function share(){
  if(!R)return;const text=summary();
  try{if(navigator.share){await navigator.share({title:'เลขศาสตร์',text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);toast('📋 คัดลอกผลแล้ว');}
  catch(e){const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
    try{document.execCommand('copy');toast('📋 คัดลอกผลแล้ว');}catch(_){toast('❌ คัดลอกไม่สำเร็จ');}t.remove();}
}
function init(){
  const today=new Date(),iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  $('#dob').max=iso;$('#pdob').max=iso;
  $$('nav button').forEach(b=>b.addEventListener('click',()=>showTab(+b.dataset.t)));
  $('#go').addEventListener('click',submit);
  const only=(id,re)=>$('#'+id).addEventListener('input',e=>{const v=e.target.value.replace(re,'');if(v!==e.target.value)e.target.value=v;});
  only('nid',/[^\d\s-]/g);only('tel',/[^\d\s+-]/g);only('seen',/\D/g);
  ['fn','ln','dob','q','nid','tel','seen'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}}));
  $('#clr').addEventListener('click',()=>{['dob','fn','ln','q','nid','tel','seen'].forEach(id=>$('#'+id).value='');$('#err').textContent='';R=null;store.del();renderAll();toast('🗑️ ล้างข้อมูลแล้ว');});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q2'&&R)ask(e.target.value);});
  const doMatch=()=>{renderMatch();fit();};$('#mgo').addEventListener('click',doMatch);$('#pdob').addEventListener('change',doMatch);
  document.addEventListener('click',e=>{
    const qs=e.target.closest('[data-qs]');if(qs){const qi=$('#q');qi.value=qs.dataset.qs;qi.focus();return;}
    const k=e.target.closest('[data-k]');if(k&&R){sel=k.dataset.k;renderCore();fit();return;}
    if(e.target.closest('#share')){share();return;}
    if(e.target.closest('#ask')){ask($('#q2').value);return;}
    const ex=e.target.closest('[data-ex]');if(ex&&R){ask(ex.dataset.ex);return;}
    const g=e.target.closest('[data-go]');if(g)showTab(+g.dataset.go);
  });
  const s=store.get();
  if(s&&typeof s==='object'){$('#dob').value=s.dob||'';$('#fn').value=s.fn||'';$('#ln').value=s.ln||'';
    const x=compute(s.dob,s.fn,s.ln);if(x.r)R=x.r;}
  renderAll();showTab(0);
  const refit=()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))fit();};
  window.addEventListener('resize',refit);window.addEventListener('orientationchange',refit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
}
init();
})();
</script>
</body>
</html>
